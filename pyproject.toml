[project]
name = "latex-resume-studio"
version = "0.8.0"
description = "A local Streamlit app that turns structured resume content into an ATS-friendly LaTeX PDF."
requires-python = ">=3.12"
dependencies = [
  "jinja2>=3.1,<4",
  "mcp>=1.26,<2",
  "pypdf>=6,<7",
  "streamlit[pdf]>=1.49,<2",
]

[project.scripts]
resume-build = "resume_builder.cli:main"
resume-mcp = "resume_builder.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resume_builder"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "resume_builder/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8,<9"]
